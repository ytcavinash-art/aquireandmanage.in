<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Latest SRA and real estate news and updates.">
    <title>Real Estate &amp; SRA News</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f9; color: #333; }
        .site-header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; }
        .site-header a { display: inline-flex; align-items: center; }
        .site-header img { display: block; height: 40px; width: auto; }
        main { padding: 40px 20px; min-height: calc(100vh - 65px); }
        .news-container { max-width: 800px; margin: auto; }
        .news-container h1 { margin: 0 0 24px; color: #10254c; }
        .news-card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .news-card h2 { margin: 0 0 10px; color: #333; font-size: 20px; }
        .news-card a { text-decoration: none; color: #0066cc; font-weight: bold; }
        .news-card a:hover { text-decoration: underline; }
        .news-card p, .news-status { color: #666; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="/" aria-label="A&amp;M Advisory home">
            <img src="/am-logo.png" alt="A&amp;M Advisory">
        </a>
    </header>

    <main>
        <div class="news-container">
            <h1>Latest SRA &amp; Real Estate News</h1>
            <div id="news-feed" class="news-status" aria-live="polite">Loading live news...</div>
        </div>
    </main>

    <script src="/news.js"></script>
</body>
</html>
