<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mumbai Redevelopment Project Gallery | A&amp;M Advisory</title>
  <meta name="description" content="View redevelopment, construction progress, before-and-after and project imagery from A&amp;M Advisory." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://www.aquireandmanage.com/gallery.html" />

  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="assets/site.webmanifest" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mumbai Redevelopment Project Gallery | A&amp;M Advisory" />
  <meta property="og:description" content="View redevelopment, construction progress, before-and-after and project imagery from A&amp;M Advisory." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

  <header class="fixed inset-x-0 top-0 z-50 bg-white/90 backdrop-blur-md transition-all shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3 md:px-10">
      <a href="index.html"><img src="images/am-logo.png" alt="A&amp;M Advisory Logo" class="h-12 w-auto" /></a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-navy">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="gallery.html" class="text-crimson font-bold">Gallery</a>
        <a href="blog.html">Blog</a>
        <a href="news.html">News</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="pt-24 min-h-screen">
    <section class="bg-navy px-6 py-16 text-center text-white">
      <span class="text-xs font-bold uppercase tracking-[0.2em] text-crimson-light">Project Media</span>
      <h1 class="mt-2 text-4xl font-bold font-serif md:text-5xl">A&amp;M Projects Gallery</h1>
    </section>

    <section class="py-20 max-w-7xl mx-auto px-6 md:px-10">
      <!-- Category Filter Tabs -->
      <div class="flex justify-center gap-3 mb-12 flex-wrap">
        <button type="button" data-category="all" class="gallery-filter-btn rounded-full bg-crimson px-5 py-2 text-xs font-bold text-white transition">All Photos</button>
        <button type="button" data-category="anj-group" id="anj-group" class="gallery-filter-btn rounded-full bg-slate-200 px-5 py-2 text-xs font-bold text-slate-700 hover:bg-slate-300 transition">ANJ Group</button>
        <button type="button" data-category="avenue-landmark-realty" id="avenue-landmark-realty" class="gallery-filter-btn rounded-full bg-slate-200 px-5 py-2 text-xs font-bold text-slate-700 hover:bg-slate-300 transition">Avenue Landmark Realty</button>
        <button type="button" data-category="navbharat-mega-developers" id="navbharat-mega-developers" class="gallery-filter-btn rounded-full bg-slate-200 px-5 py-2 text-xs font-bold text-slate-700 hover:bg-slate-300 transition">Navbharat Mega Developers</button>
        <button type="button" data-category="tata-projects" id="tata-projects" class="gallery-filter-btn rounded-full bg-slate-200 px-5 py-2 text-xs font-bold text-slate-700 hover:bg-slate-300 transition">Tata Projects</button>
      </div>

      <!-- Gallery Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div data-category="anj-group" class="gallery-item overflow-hidden rounded-2xl bg-white border border-slate-200 shadow-md">
          <img src="images/sra-project-optimized.jpg" alt="SRA Project Site" class="h-64 w-full object-cover hover:scale-105 transition duration-500" />
          <div class="p-4">
            <h3 class="font-bold text-navy text-base">SRA Rehabilitation Site</h3>
            <p class="text-xs text-slate-500 mt-1">ANJ Group Project</p>
          </div>
        </div>

        <div data-category="avenue-landmark-realty" class="gallery-item overflow-hidden rounded-2xl bg-white border border-slate-200 shadow-md">
          <img src="images/liaisoning-optimized.jpg" alt="Statutory Approvals Site" class="h-64 w-full object-cover hover:scale-105 transition duration-500" />
          <div class="p-4">
            <h3 class="font-bold text-navy text-base">Redevelopment Sector Survey</h3>
            <p class="text-xs text-slate-500 mt-1">Avenue Landmark Realty</p>
          </div>
        </div>

        <div data-category="tata-projects" class="gallery-item overflow-hidden rounded-2xl bg-white border border-slate-200 shadow-md">
          <img src="images/facility-management.jpg" alt="Completed Housing Facility" class="h-64 w-full object-cover hover:scale-105 transition duration-500" />
          <div class="p-4">
            <h3 class="font-bold text-navy text-base">Rehabilitation Housing Complex</h3>
            <p class="text-xs text-slate-500 mt-1">Tata Projects Coordination</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-[#0e172a] text-white py-10 text-center text-xs">
    © 2026 A&amp;M Advisory. All Rights Reserved.
  </footer>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
